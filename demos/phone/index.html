<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phone</title>
    <link rel="icon" href="/style/favicon.ico" />
    <link rel="stylesheet" href="/style/vonage.css" />
  </head>
  <body>
    <main>
      <header>
        <img class="vg-logo" src="/style/vonage-logo.svg" alt="Vonage" />
        <h1>Phone</h1>
      </header>
      <div class="vg-dial">
        <div class="vg-field">
          <input id="number" class="vg-field__input" inputmode="tel" placeholder=" " />
          <label class="vg-field__label" for="number">Number with country code</label>
        </div>
        <button id="delete" class="vg-dial__delete" type="button" aria-label="Delete">
          <svg viewBox="0 0 28 20" aria-hidden="true">
            <path d="M9 0h16a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H9L0 10z" />
            <path d="m14.5 6 8 8m0-8-8 8" />
          </svg>
        </button>
      </div>
      <div id="pad" class="vg-keypad"></div>
      <div class="vg-actions">
        <button id="call" class="vg-btn vg-btn--electric" type="button" disabled>Call</button>
        <button id="hangup" class="vg-btn vg-btn--secondary" type="button" disabled>Hang up</button>
      </div>
      <p id="status" class="vg-status" role="status">logging in</p>
    </main>

    <script type="module">
      import { VonageClient } from "/sdk.js";

      const number = document.getElementById("number");
      const callButton = document.getElementById("call");
      const hangupButton = document.getElementById("hangup");
      const status = document.getElementById("status");
      const show = (text) => {
        status.textContent = text;
      };

      // The server created the user in the EU, so the SDK logs in there.
      const client = new VonageClient({ region: "EU" });
      // The call in progress, and a call that rings in.
      let callId = null;
      let inviteId = null;

      // A call ringing in rings, makes Answer pulse and puts itself in the tab's title, which you see
      // from another tab too. The SDK plays no ringtone, so the page makes one: a double ring every
      // three seconds. Browsers play sound only on a page you have clicked since it loaded.
      const title = document.title;
      let ringing = null;
      const ring = () => {
        stopRinging();
        const audio = new AudioContext();
        const volume = new GainNode(audio, { gain: 0 });
        volume.connect(audio.destination);
        for (const frequency of [400, 450]) {
          const tone = new OscillatorNode(audio, { frequency });
          tone.connect(volume);
          tone.start();
        }
        const burst = () => {
          for (const start of [0, 0.6]) {
            volume.gain.setValueAtTime(0.1, audio.currentTime + start);
            volume.gain.setValueAtTime(0, audio.currentTime + start + 0.4);
          }
        };
        burst();
        ringing = { audio, timer: setInterval(burst, 3000) };
        callButton.classList.add("vg-btn--ringing");
        document.title = "Incoming call";
      };
      const stopRinging = () => {
        if (!ringing) return;
        clearInterval(ringing.timer);
        ringing.audio.close();
        ringing = null;
        callButton.classList.remove("vg-btn--ringing");
        document.title = title;
      };

      // Back to the dialpad, ready for the next call.
      const idle = (text) => {
        stopRinging();
        callId = null;
        inviteId = null;
        callButton.textContent = "Call";
        callButton.disabled = false;
        hangupButton.disabled = true;
        show(text);
      };

      // Each key with the letters under it, as on a mobile phone.
      const keys = "1,2 ABC,3 DEF,4 GHI,5 JKL,6 MNO,7 PQRS,8 TUV,9 WXYZ,*,0 +,#".split(",");
      // Holding 0 dials a +. Tones have no +, so in a call 0 stays 0.
      let holdTimer;
      let held = false;
      for (const label of keys) {
        const [key, letters = ""] = label.split(" ");
        const button = document.createElement("button");
        const small = document.createElement("small");
        small.textContent = letters;
        button.append(key, small);
        button.ariaLabel = key;
        button.onpointerdown = () => {
          held = false;
          if (key !== "0" || callId) return;
          holdTimer = setTimeout(() => {
            held = true;
            number.value += "+";
          }, 500);
        };
        button.onpointerup = button.onpointerleave = () => clearTimeout(holdTimer);
        // In a call, a key sends its tone, for example to answer a phone menu. Otherwise it dials.
        button.onclick = () => {
          // The click that ends a hold: the + is in already.
          if (held) {
            held = false;
            return;
          }
          if (callId) client.sendDTMF(callId, key).catch((error) => show(error.message));
          else number.value += key;
        };
        document.getElementById("pad").append(button);
      }
      document.getElementById("delete").onclick = () => {
        number.value = number.value.slice(0, -1);
      };

      // While a call rings in, Call turns into Answer, and Hang up declines the call.
      callButton.onclick = async () => {
        callButton.disabled = true;
        try {
          if (inviteId) {
            stopRinging();
            await client.answer(inviteId);
            callId = inviteId;
            inviteId = null;
            show("answered");
          } else {
            show("calling");
            // Vonage passes `to` to your Answer URL, which connects the call to that number.
            callId = await client.serverCall({ to: number.value });
            hangupButton.disabled = false;
          }
        } catch (error) {
          idle(`could not connect: ${error.message}`);
        }
      };
      hangupButton.onclick = () => {
        if (inviteId) {
          client.reject(inviteId).catch((error) => show(error.message));
          idle("call declined");
        } else {
          client.hangup(callId).catch((error) => show(error.message));
        }
      };

      // Listen before createSession() below: a call can ring in as the page logs in.
      client.on("callInvite", (id, from) => {
        inviteId = id;
        callButton.textContent = "Answer";
        callButton.disabled = false;
        hangupButton.disabled = false;
        show(`call from ${from}`);
        ring();
      });
      // The call stopped ringing: the caller hung up, it timed out, or another page took it.
      client.on("callInviteCancel", (_id, reason) => idle(`missed call: ${reason}`));
      // Status values are RINGING, ANSWERED and COMPLETED.
      client.on("legStatusUpdate", (_id, _legId, legStatus) => show(legStatus.toLowerCase()));
      client.on("callHangup", (_id, _quality, reason) =>
        idle(`call ended: ${reason.toLowerCase().replaceAll("_", " ")}`),
      );
      client.on("sessionError", (reason) => show(`logged out: ${reason}. Reload the page.`));

      try {
        const { token } = await (await fetch("/token")).json();
        await client.createSession(token);
        callButton.disabled = false;
        if (!inviteId) show("ready");
      } catch (error) {
        show(`could not log in: ${error.message}`);
      }
    </script>
  </body>
</html>
